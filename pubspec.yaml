name: ua_air_alerts
description: "UA Air Alerts — курсова робота"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.2.3
  flutter_bloc: ^9.1.1
  http: ^1.4.0
  json_annotation: ^4.12.0
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.3.1
  flutter_cache_manager: ^3.4.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  shared_preferences: ^2.3.4
  workmanager: ^0.5.2
  flutter_local_notifications: ^18.0.1
  audioplayers: ^6.1.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.9.5
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/
    - assets/map/
    - assets/map/oblasts/
